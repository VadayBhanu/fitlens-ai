name: Deploy

# Deploys the API (Cloudflare Workers + D1) and the web studio (Cloudflare Pages).
# Enable by setting the repository variable DEPLOY_ENABLED=true after completing
# docs/GUIDE.md → "Automate deployments".
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  api:
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Point wrangler.toml at the production D1 database
        run: sed -i "s/00000000-0000-0000-0000-000000000000/${{ secrets.D1_DATABASE_ID }}/" apps/api/wrangler.toml
      - name: Enable Workers AI review summaries
        if: ${{ vars.ENABLE_WORKERS_AI == 'true' }}
        run: sed -i 's/^# \[ai\]/[ai]/; s/^# binding = "AI"/binding = "AI"/' apps/api/wrangler.toml
      - name: Apply database migrations
        working-directory: apps/api
        run: npx wrangler d1 migrations apply fitlens --remote
      - name: Deploy Worker
        working-directory: apps/api
        run: >
          npx wrangler deploy
          --var ENVIRONMENT:production
          --var APP_ORIGIN:${{ vars.WEB_URL }}
          --var ALLOWED_ORIGINS:${{ vars.WEB_URL }},chrome-extension://${{ vars.EXTENSION_ID }}
          --var PUBLIC_API_ORIGIN:${{ vars.API_URL }}
          --var FREE_DAILY_TRYONS:${{ vars.FREE_DAILY_TRYONS || '10' }}

  web:
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    needs: api
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Allow the production API in the web CSP
        run: sed -i "s#http://localhost:8787#${{ vars.API_URL }}#" apps/web/public/_headers
      - run: npm run build -w @fitlens/web
        env:
          VITE_API_URL: ${{ vars.API_URL }}
          VITE_EXTENSION_URL: ${{ vars.EXTENSION_STORE_URL }}
      - name: Deploy to Cloudflare Pages
        run: npx wrangler pages deploy apps/web/dist --project-name=${{ vars.PAGES_PROJECT || 'fitlens-web' }} --branch=main

  extension:
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run package:extension
        env:
          FITLENS_API_URL: ${{ vars.API_URL }}
          FITLENS_WEB_URL: ${{ vars.WEB_URL }}
      - uses: actions/upload-artifact@v4
        with:
          name: fitlens-extension-production
          path: apps/extension/release/*.zip
